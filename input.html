<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quét nhập / xuất · 스캔 입력 — MoldTracking</title>
<!-- MoldTracking scan input page v0.1 (2026-10-04)
     v0.1: first version. Scan the ticket QR -> part name and current state -> NHẬP (입고) / XUẤT (출고).
           Camera loop taken from the QR Scan Test page v1.4 (own loop, BarcodeDetector + jsQR,
           full frame / centre zoom alternating), which was confirmed on Galaxy, iPhone and Xiaomi.
           If nothing is read within 3 s a "choose from list" button appears (slow phones).
           The process (công đoạn) is chosen once per phone, or given in the address: input.html?proc=QC
     Must be hosted OUTSIDE Apps Script (GitHub Pages): the camera is refused inside an Apps Script web app.
     Open with Chrome / Safari (home screen shortcut), not inside Zalo. -->
<link rel="stylesheet" href="mt-common.css">
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="mt-common.js"></script>
<style>
  section { display: none; }
  #procBar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px; }
  #procBar b { font-size: 18px; }
  #procBar button { width: auto; margin: 0; padding: 8px 14px; font-size: 14px; }
  #video { width: 100%; border-radius: 10px; background: #000; }
  #last { font-size: 17px; font-weight: 700; min-height: 24px; }
  #pCode { font-size: 22px; word-break: break-all; }
  #pName { font-size: 24px; font-weight: 700; margin: 4px 0 8px; }
  #pState { font-size: 16px; padding: 8px; background: #eef0ee; border-radius: 8px; }
</style>
</head>
<body>
<div class="wrap">
<div class="card" id="procBar">
  <div><span class="small">Công đoạn · 공정</span><br><b id="procName">—</b> <span class="small" id="workerName"></span></div>
  <button class="b-sub" id="btnProc">Đổi · 바꾸기</button>
</div>
<div id="err"></div>
<div id="noaddr">Chưa có địa chỉ Sheet · 시트 주소가 없습니다. Hỏi quản lý để lấy QR cài đặt · 관리자에게 설정 QR을 받으십시오. <a href="setup.html">Cài đặt · 설정</a></div>

<section id="vPick" class="card">
  <h2 id="pickTitle"></h2>
  <div id="pickList"></div>
  <button class="b-sub" id="btnPickBack" style="display:none">Quay lại<small>뒤로</small></button>
</section>

<section id="vHome">
  <div class="card"><div id="last" class="msg"></div></div>
  <button class="b-in b-big" id="btnScan">QUÉT QR<small>스캔</small></button>
  <button class="b-sub" id="btnList">Chọn từ danh sách<small>목록에서 선택 (QR이 안 읽힐 때)</small></button>
</section>

<section id="vScan" class="card">
  <video id="video"></video>
  <div class="msg" id="scanMsg">Đưa QR vào giữa màn hình · QR을 화면 가운데에</div>
  <button class="b-sub" id="btnScanList" style="display:none">Chọn từ danh sách<small>목록에서 선택</small></button>
  <button class="b-out" id="btnCam" style="display:none">Đổi camera<small>카메라 바꾸기</small></button>
  <button class="b-sub" id="btnStop">Dừng<small>중지</small></button>
  <div class="small" id="camInfo"></div>
</section>

<section id="vPart">
  <div class="card">
    <div class="code" id="pCode"></div>
    <div id="pName"></div>
    <div class="small" id="pMold"></div>
    <div id="pState"></div>
  </div>
  <div class="row2">
    <button class="b-in b-big" id="btnIn">NHẬP<small>입고</small></button>
    <button class="b-out b-big" id="btnOut">XUẤT<small>출고</small></button>
  </div>
  <div class="msg" id="sendMsg"></div>
  <button class="b-sub" id="btnCancel">Hủy<small>취소</small></button>
</section>

<div class="card"><div class="small" id="selfcheck">Script chưa chạy · 프로그램 실행 안 됨</div></div>
</div>

<script>
(function () {
  var $ = MT.$, esc = MT.esc;
  var detector = null;
  try { if ('BarcodeDetector' in window) detector = new BarcodeDetector({ formats: ['qr_code'] }); } catch (e) { detector = null; }
  var decoderName = (detector ? 'BarcodeDetector+' : '') + (typeof jsQR === 'function' ? 'jsQR' : 'jsQR-MISSING');
  MT.init('input', 'v0.1', decoderName);

  var masters = { processes: [], workers: [] }, cur = null;       // cur: part shown on the part view
  var EV_TEXT = { IN: 'NHẬP · 입고', OUT: 'XUẤT · 출고' };

  // ---------- views ----------
  function view(name) {
    ['vPick', 'vHome', 'vScan', 'vPart'].forEach(function (v) { $(v).style.display = v === name ? 'block' : 'none'; });
  }
  function home(text, cls) {
    cur = null;
    if (text !== undefined) { $('last').textContent = text; $('last').className = 'msg ' + (cls || ''); }
    view('vHome');
  }
  function pick(title, items, onPick, onBack) {
    $('pickTitle').textContent = title;
    var box = $('pickList');
    box.innerHTML = '';
    items.forEach(function (it) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'pick';
      b.innerHTML = esc(it.label) + (it.sub ? '<small>' + esc(it.sub) + '</small>' : '');
      b.onclick = function () { onPick(it.value); };
      box.appendChild(b);
    });
    if (!items.length) box.textContent = 'Không có dữ liệu · 목록이 비어 있음';
    $('btnPickBack').style.display = onBack ? 'block' : 'none';
    $('btnPickBack').onclick = onBack || null;
    view('vPick');
  }

  // ---------- process and worker (chosen once, kept on this phone) ----------
  function procOf(code) {
    for (var i = 0; i < masters.processes.length; i++) if (masters.processes[i].code === code) return masters.processes[i];
    return null;
  }
  function procLabel(code) { var p = procOf(code); return p ? p.vi + ' · ' + p.ko : code; }
  function header() {
    var p = MT.get('mtProc');
    $('procName').textContent = p ? procLabel(p) : '—';
    $('workerName').textContent = MT.get('mtWorkerName');
  }
  function chooseProc() {
    pick('Bạn đang ở công đoạn nào? · 어느 공정입니까?', masters.processes.map(function (p) {
      return { label: p.vi, sub: p.ko, value: p.code };
    }), function (code) { MT.set('mtProc', code); header(); chooseWorker(false); });
  }
  function chooseWorker(force) {
    var ws = masters.workers, known = ws.some(function (w) { return w.code === MT.get('mtWorker'); });
    if (!ws.length || (known && !force)) { home(); return; }
    pick('Bạn là ai? · 누구입니까?', ws.map(function (w) { return { label: w.name, sub: w.code, value: w.code }; }),
      function (code) {
        ws.forEach(function (w) { if (w.code === code) MT.set('mtWorkerName', w.name); });
        MT.set('mtWorker', code); header(); home();
      });
  }
  function start() {
    header();
    if (!masters.processes.length) { home('Chưa có danh sách công đoạn · 공정 목록 없음', 'ng'); return; }
    if (!procOf(MT.get('mtProc'))) chooseProc(); else chooseWorker(false);
  }
  $('btnProc').onclick = function () { stopScan(); if (masters.processes.length) chooseProc(); };

  // ---------- part view ----------
  function showPart(part, mold, state) {
    cur = part;
    $('pCode').textContent = part.partId;
    $('pName').textContent = part.name || '(không tên · 이름 없음)';
    $('pMold').textContent = 'Khuôn · 금형 ' + part.moldNo + (mold && mold.product ? ' — ' + mold.product : '') +
                             (part.material ? ' / ' + part.material : '');
    $('pState').textContent = state
      ? 'Hiện tại · 현재: ' + (state.process ? procLabel(state.process) + ' — ' : '') + (MT.STATUS[state.status] || state.status) +
        (state.lastEvent ? ' (' + MT.fmtTime(state.lastTime) + ')' : '')
      : 'Hiện tại · 현재: ' + MT.STATUS.NEW;
    $('sendMsg').textContent = '';
    $('btnIn').disabled = false; $('btnOut').disabled = false;
    view('vPart');
  }
  function lookup(text) {
    MT.clearError();
    var code = String(text || '').toUpperCase().trim();
    if (!MT.ID_RE.test(code)) { home('QR không phải mã chi tiết · 부품코드가 아닌 QR: ' + code.substring(0, 40), 'ng'); return; }
    home('Đang tìm · 찾는 중... ' + code, '');
    MT.api('getPart', { partId: code }).then(function (j) {
      if (!j.found) { home('Chưa đăng ký · 등록되지 않은 코드: ' + code, 'ng'); return; }
      if (j.part.type !== 'M') { home('Hàng tiêu chuẩn, không theo dõi từng cái · 표준품 (낱개 추적 안 함): ' + code, 'warn'); return; }
      showPart(j.part, j.mold, j.state);
    }).catch(function (e) { home('', ''); MT.showError('getPart', e); });
  }
  function send(ev) {
    if (!cur) return;
    MT.clearError();
    var part = cur, t1 = Date.now();
    $('btnIn').disabled = true; $('btnOut').disabled = true;              // no double entry
    $('sendMsg').className = 'msg'; $('sendMsg').textContent = 'Đang gửi · 보내는 중...';
    MT.api('logEvent', { partId: part.partId, process: MT.get('mtProc'), event: ev, worker: MT.get('mtWorker'), rev: 0 })
      .then(function () {
        if (navigator.vibrate) navigator.vibrate(80);
        home('✔ ' + EV_TEXT[ev] + ' — ' + part.partId + ' ' + part.name + '\nĐã ghi · 기록됨 (' +
             ((Date.now() - t1) / 1000).toFixed(1) + ' s)', 'ok');
      }).catch(function (e) {
        $('sendMsg').className = 'msg ng';
        $('sendMsg').textContent = 'Chưa ghi được, bấm lại · 기록 안 됨, 다시 누르십시오';
        $('btnIn').disabled = false; $('btnOut').disabled = false;
        MT.showError('logEvent', e);
      });
  }
  $('btnIn').onclick = function () { send('IN'); };
  $('btnOut').onclick = function () { send('OUT'); };
  $('btnCancel').onclick = function () { home('', ''); };

  // ---------- choose from list (always available when the QR cannot be read) ----------
  function natural(a, b) { return a.partId.localeCompare(b.partId, 'en', { numeric: true }); }
  function listMolds() {
    stopScan(); MT.clearError();
    pick('Đang tải · 불러오는 중...', [], function () {}, function () { home(); });
    MT.api('listMolds').then(function (j) {
      pick('Chọn khuôn · 금형 선택', j.molds.map(function (m) {
        return { label: m.moldNo, sub: (m.product ? m.product + ' — ' : '') + m.machined + ' chi tiết · 부품', value: m.moldNo };
      }), listParts, function () { home(); });
    }).catch(function (e) { home(); MT.showError('listMolds', e); });
  }
  function listParts(moldNo) {
    pick('Đang tải · 불러오는 중...', [], function () {}, listMolds);
    MT.api('listParts', { moldNo: moldNo }).then(function (j) {
      var parts = j.parts.filter(function (p) { return p.type === 'M'; }).sort(natural), byId = {};
      parts.forEach(function (p) { byId[p.partId] = p; });
      pick('Chọn chi tiết · 부품 선택 — ' + moldNo, parts.map(function (p) {
        return { label: p.partNo + '  ' + p.name, sub: p.state ? (MT.STATUS[p.state.status] || '') : '', value: p.partId };
      }), function (id) { showPart(byId[id], j.mold, byId[id].state); }, listMolds);
    }).catch(function (e) { home(); MT.showError('listParts', e); });
  }
  $('btnList').onclick = listMolds;
  $('btnScanList').onclick = listMolds;

  // ---------- camera scan (from QR Scan Test v1.4) ----------
  var video = $('video'), canvas = document.createElement('canvas');
  var ctx = canvas.getContext('2d', { willReadFrequently: true });
  var stream = null, timer = null, t0 = 0, working = false, cams = [], camIdx = -1, tickN = 0;

  function decodeCanvas() {
    var p = detector
      ? detector.detect(canvas).then(function (r) { return r.length ? r[0].rawValue : null; }).catch(function () { return null; })
      : Promise.resolve(null);
    return p.then(function (text) {
      if (text) return text;
      if (typeof jsQR !== 'function') return null;
      var img = ctx.getImageData(0, 0, canvas.width, canvas.height);
      var r = jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' });
      return r && r.data ? r.data : null;
    });
  }
  function stopStream() {
    if (timer) { clearInterval(timer); timer = null; }
    if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
  }
  function stopScan() { stopStream(); }
  function tick() {
    if (working || !stream || !video.videoWidth) return;
    working = true; tickN++;
    var vw = video.videoWidth, vh = video.videoHeight;
    var zoom = (tickN % 2 === 0);                                   // every other frame: centre half, enlarged
    var s = Math.min(vw, vh) * (zoom ? 0.5 : 1);
    var out = zoom ? Math.min(1080, Math.round(s * 1.5)) : Math.min(s, 1080);
    canvas.width = out; canvas.height = out;
    ctx.drawImage(video, (vw - s) / 2, (vh - s) / 2, s, s, 0, 0, out, out);
    decodeCanvas().then(function (text) {
      working = false;
      if (!stream) return;
      if (text) {
        if (navigator.vibrate) navigator.vibrate(120);
        stopScan();
        lookup(text);
      } else if (Date.now() - t0 > 3000) {
        $('btnScanList').style.display = 'block';
        $('scanMsg').textContent = 'Chưa đọc được: để xa hơn (25–30 cm) hoặc chọn từ danh sách · 안 읽히면 더 멀리(25~30cm) 또는 목록에서 선택';
      }
    }).catch(function (e) { working = false; $('camInfo').textContent = 'decode error: ' + (e && e.message ? e.message : e); });
  }
  function openCamera(deviceId) {
    var v = { width: { ideal: 1920 }, height: { ideal: 1080 } };
    if (deviceId) v.deviceId = { exact: deviceId }; else v.facingMode = { ideal: 'environment' };
    return navigator.mediaDevices.getUserMedia({ audio: false, video: v }).then(function (s) {
      stream = s;
      video.setAttribute('playsinline', ''); video.setAttribute('muted', ''); video.muted = true;
      video.srcObject = s;
      return video.play();
    }).then(function () {
      var track = stream.getVideoTracks()[0];
      try { track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(function () {}); } catch (e) {}
      return navigator.mediaDevices.enumerateDevices().catch(function () { return []; });
    }).then(function (list) {
      var track = stream.getVideoTracks()[0];
      var id = track.getSettings ? track.getSettings().deviceId : '';
      cams = list.filter(function (d) { return d.kind === 'videoinput' && !/front|user|전면|trước/i.test(d.label || ''); });
      camIdx = -1;
      cams.forEach(function (d, i) { if (d.deviceId === id) camIdx = i; });
      $('btnCam').style.display = cams.length > 1 ? 'block' : 'none';
      $('camInfo').textContent = decoderName + ' / cam ' + (camIdx + 1) + ' of ' + cams.length + ' / ' + (track.label || 'no label');
      t0 = Date.now();
      timer = setInterval(tick, 150);
    });
  }
  function camFail(err) {
    stopScan();
    home('Không mở được camera → chọn từ danh sách · 카메라 열기 실패 → 목록에서 선택', 'ng');
    MT.showError('camera', err);
  }
  $('btnScan').onclick = function () {
    MT.clearError();
    if (typeof jsQR !== 'function' && !detector) { camFail(MT.named('DecoderMissing', 'jsQR không tải được · jsQR을 불러오지 못함')); return; }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { camFail(MT.named('NoGetUserMedia', 'Trình duyệt không hỗ trợ camera · 이 브라우저는 카메라 미지원 (Chrome / Safari로 여십시오)')); return; }
    $('btnScanList').style.display = 'none';
    $('scanMsg').textContent = 'Đưa QR vào giữa màn hình · QR을 화면 가운데에';
    view('vScan');
    openCamera(null).catch(camFail);
  };
  $('btnCam').onclick = function () {
    if (cams.length < 2) return;
    var next = cams[(camIdx + 1) % cams.length];
    stopStream();
    openCamera(next.deviceId).catch(camFail);
  };
  $('btnStop').onclick = function () { stopScan(); home(); };

  // ---------- start: masters from this phone first (fast), then refreshed from the sheet ----------
  var urlProc = (/[?&]proc=([A-Za-z0-9]+)/.exec(location.search) || [])[1];
  if (urlProc) MT.set('mtProc', urlProc.toUpperCase());
  try { var c = JSON.parse(MT.get('mtMasters') || 'null'); if (c && c.processes) masters = c; } catch (e) {}
  if (masters.processes.length) start(); else home('Đang tải · 불러오는 중...', '');
  if (MT.hasGas()) {
    MT.api('listMasters').then(function (j) {
      var first = !masters.processes.length;
      masters = { processes: j.processes, workers: j.workers };
      MT.set('mtMasters', JSON.stringify(masters));
      if (first) { $('last').textContent = ''; start(); } else header();
    }).catch(function (e) { if (!masters.processes.length) home('', ''); MT.showError('listMasters', e); });
  } else { home('', ''); }
})();
</script>
</body>
</html>
